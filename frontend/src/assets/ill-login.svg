    <rect x="96" y="148" width="20" height="26" rx="4" fill="url(#lgGlass)" opacity="0.7"/>
    <rect x="124" y="152" width="26" height="22" rx="4" fill="#fff" stroke="#0F766E" stroke-width="2"/>
