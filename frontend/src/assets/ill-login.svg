    <circle cx="88" cy="228" r="26" fill="#fff"/>
    <circle cx="88" cy="228" r="26" fill="none" stroke="#0F766E" stroke-width="2.4"/>
    <path d="M82 214h12v10h10v12H94v10H82v-10H72v-12h10z" fill="#0F766E"/>
