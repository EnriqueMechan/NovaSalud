  </defs>

  <rect x="0" y="0" width="360" height="300" rx="22" fill="url(#lgSky)"/>
  <circle cx="300" cy="52" r="34" fill="#fff" opacity="0.55"/>
  <circle cx="58" cy="248" r="46" fill="#fff" opacity="0.4"/>

  <!-- estanteria -->
  <rect x="44" y="52" width="180" height="128" rx="10" fill="#fff" opacity="0.82"/>
  <rect x="44" y="96" width="180" height="3" fill="#CBD5E1"/>
  <rect x="44" y="140" width="180" height="3" fill="#CBD5E1"/>

  <!-- frascos fila 1 -->
  <g>
    <rect x="58" y="64" width="22" height="30" rx="4" fill="url(#lgGlass)"/>
    <rect x="63" y="59" width="12" height="7" rx="2" fill="#115E59"/>
    <rect x="90" y="70" width="20" height="24" rx="4" fill="#0F766E" opacity="0.75"/>
