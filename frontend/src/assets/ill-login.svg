<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-label="Botica Nova Salud">
  <defs>
    <linearGradient id="lgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CCFBF1"/>
      <stop offset="1" stop-color="#E7EEF6"/>
    </linearGradient>
    <linearGradient id="lgBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#115E59"/>
