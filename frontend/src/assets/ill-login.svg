    <path d="M67 120h12M73 114v12" stroke="#B91C1C" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="96" y="112" width="20" height="24" rx="4" fill="url(#lgGlass)" opacity="0.8"/>
